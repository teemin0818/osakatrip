<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大阪三日小旅行</title>
<meta name="description" content="2026.10.25–10.27 大阪三日行程：梅田、心齋橋、環球影城、日本橋">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFCF6;--ink:#3E3A39;--coral:#F2A497;--yellow:#F6D27A;--water:#A8D3E6;--green:#B9DAA5;--coral-l:#FDE3DD;--yellow-l:#FBEFC9;--water-l:#DDEEF5;--green-l:#E3F0DA}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Huninn','PingFang TC','Noto Sans TC',sans-serif;line-height:1.55}
a{color:var(--ink);text-decoration-color:var(--coral);text-decoration-thickness:3px;text-underline-offset:3px}
a:hover{color:#000;text-decoration-color:var(--ink)}
section{scroll-margin-top:84px}
h1,h2,h3{font-weight:normal}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
/* nav */
nav{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:3px solid var(--ink)}
nav .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.brand{display:flex;align-items:center;gap:8px;flex:none;text-decoration:none;font-size:18px}
.navlinks{display:flex;gap:6px;overflow-x:auto;margin-left:auto;scrollbar-width:none}
.navlinks::-webkit-scrollbar{display:none}
.navlink{padding:8px 12px;border-radius:999px;font-size:15px;white-space:nowrap;text-decoration:none}
.navlink:hover{background:var(--yellow)}
main{display:flex;flex-direction:column;gap:48px;padding-bottom:64px}
.box{border:3px solid var(--ink);border-radius:24px;background:#fff}
.h2{margin:0;font-size:26px;display:flex;align-items:center;gap:10px}
.pill{display:inline-block;padding:1px 10px;border:2px solid var(--ink);border-radius:999px;font-size:13px;background:var(--paper)}
/* hero */
#home{padding-top:24px;display:flex;flex-direction:column;gap:20px}
.hero-art{border:3px solid var(--ink);border-radius:28px;background:#E9F4F9;overflow:hidden}
.hero-art svg{display:block;width:100%;height:auto}
.hero-text{text-align:center;display:flex;flex-direction:column;gap:6px}
.date-chip{align-self:center;padding:4px 14px;border:3px solid var(--ink);border-radius:999px;background:var(--yellow);font-size:14px}
.hero-text h1{margin:6px 0 0;font-size:44px;letter-spacing:2px}
.hero-text p{margin:0}
.countdown{padding:18px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.countdown p{margin:0;font-size:15px}
.cd-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:440px}
.cd-cell{border:3px solid var(--ink);border-radius:18px;padding:10px 4px;text-align:center}
.cd-num{font-size:30px;line-height:1.1}
.cd-unit{font-size:13px}
.cd-done{font-size:26px}
/* flights */
.flights{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.flight{overflow:hidden}
.band{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 18px;border-bottom:3px solid var(--ink)}
.band .no{padding:2px 10px;border:2.5px solid var(--ink);border-radius:999px;background:var(--paper);font-size:14px}
.route{padding:16px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px}
.code{font-size:30px;line-height:1.1}
.term{font-size:13px}
.clock{font-size:20px;margin-top:4px}
.fnote{border-top:3px dashed var(--ink);padding:10px 18px;font-size:14px}
/* days */
#days{display:flex;flex-direction:column;gap:18px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.daytab{font-family:inherit;color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:10px 6px;min-height:44px;text-align:center;background:#fff;box-shadow:0 2px 0 var(--ink);cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}
.daytab:hover{transform:translateY(-2px)}
.daytab[aria-pressed="true"]{box-shadow:0 5px 0 var(--ink);transform:translateY(-3px)}
.daytab span{display:block}
.daytab .s{font-size:13px}
.daytab .l{font-size:22px;line-height:1.2}
.panel{display:flex;flex-direction:column;gap:18px}
.dayhead{border:3px solid var(--ink);border-radius:24px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.dayhead .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.dayhead svg{flex:none}
.timeline{position:relative;display:flex;flex-direction:column;gap:12px}
.tl-line{position:absolute;left:82px;top:16px;bottom:16px;border-left:3px dotted var(--ink)}
.tl-item{display:grid;grid-template-columns:64px 24px minmax(0,1fr);gap:8px}
.tl-time{font-size:15px;text-align:right;padding-top:14px;white-space:pre-line;line-height:1.25}
.tl-dot{display:flex;justify-content:center;padding-top:16px}
.tl-dot span{display:block;width:18px;height:18px;border-radius:50%;border:3px solid var(--ink);position:relative;z-index:1;background:var(--paper)}
.card{min-width:0;border-radius:18px;padding:10px 14px;border:3px solid var(--ink);background:#fff}
.card.transit{border-style:dashed;background:var(--paper)}
.card.must{background:#FFF0EC}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.must-badge{display:inline-flex;align-items:center;gap:4px;padding:1px 10px 1px 7px;border:2px solid var(--ink);border-radius:999px;background:var(--coral);font-size:13px}
.title{font-size:17px;margin-top:6px}
.note{font-size:14px;margin-top:2px}
.subs{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.subs li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.floor{flex:none;min-width:34px;text-align:center;padding:0 6px;border:2px solid var(--ink);border-radius:8px;background:var(--water-l);font-size:12px;line-height:20px}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
/* todo */
#todo{display:flex;flex-direction:column;gap:16px}
.todo-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.count{padding:4px 14px;border:3px solid var(--ink);border-radius:999px;background:var(--green-l);font-size:15px}
.bar{height:16px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.bar div{height:100%;background:var(--green);width:0;transition:width .4s ease}
.groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.group{border:3px solid var(--ink);border-radius:24px;padding:16px}
.group h3{margin:0 0 10px;font-size:18px}
.group .list{display:flex;flex-direction:column;gap:4px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer;position:relative;font-size:16px}
.chk{appearance:none;-webkit-appearance:none;margin:0;width:28px;height:28px;border:3px solid var(--ink);border-radius:9px;background:#fff;cursor:pointer;flex:none}
.chk:checked{background:var(--green)}
.check .tick{position:absolute;left:0;top:50%;margin-top:-14px;pointer-events:none;display:none}
.chk:checked ~ .tick{display:block}
.chk:checked ~ .lbl{text-decoration:line-through;text-decoration-thickness:2px;opacity:.75}
/* stay */
#stay{display:flex;flex-direction:column;gap:16px}
.stay{padding:18px;display:flex;flex-wrap:wrap;gap:18px;align-items:center}
.stay svg{flex:none}
.stay-body{flex:999 1 260px;min-width:0;display:flex;flex-direction:column;gap:10px}
.stay-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stay-grid div.c{border:2.5px solid var(--ink);border-radius:16px;padding:8px 12px}
.mapbtn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 18px;border:3px solid var(--ink);border-radius:999px;background:var(--water);text-decoration:none;font-size:15px}
footer{text-align:center;font-size:14px;padding-top:8px}
:focus-visible{outline:3px dashed var(--ink);outline-offset:3px}
/* motion */
.spin{transform-box:fill-box;transform-origin:center;animation:spin 28s linear infinite}
.bob{animation:bob 4s ease-in-out infinite}
.drift{animation:drift 9s ease-in-out infinite}
.drift2{animation:drift 12s ease-in-out infinite reverse}
.fly{animation:fly 6s ease-in-out infinite}
.twinkle{transform-box:fill-box;transform-origin:center;animation:twinkle 3s ease-in-out infinite}
.chug{animation:chug 7s ease-in-out infinite}
.bounce{animation:bounceIn .6s cubic-bezier(.34,1.56,.64,1) both}
.pop{animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
@keyframes fly{0%,100%{transform:translate(0,0) rotate(-4deg)}50%{transform:translate(10px,-8px) rotate(2deg)}}
@keyframes twinkle{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
@keyframes chug{0%,100%{transform:translateX(0)}50%{transform:translateX(-18px)}}
@keyframes bounceIn{0%{opacity:0;transform:translateY(18px) scale(.96)}60%{opacity:1;transform:translateY(-6px) scale(1.01)}100%{transform:translateY(0) scale(1)}}
@keyframes popIn{0%{opacity:0;transform:translateY(14px)}70%{opacity:1;transform:translateY(-3px)}100%{transform:translateY(0)}}
@media (max-width:520px){.brand span{display:none}.hero-text h1{font-size:34px}.tl-item{grid-template-columns:52px 20px minmax(0,1fr)}.tl-line{left:70px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none !important;transition:none !important}}
</style>
</head>

  }).join('');

  function updateCount() {
    var boxes = document.querySelectorAll('.chk');
    var done = 0;
    boxes.forEach(function (b) { if (b.checked) done++; });
    $('todo-count').textContent = done + ' / ' + boxes.length + ' 完成';
    var pct = boxes.length ? Math.round(done / boxes.length * 100) : 0;
    var bar = $('todo-bar');
    bar.style.width = pct + '%';
    bar.style.borderRight = (pct > 0 && pct < 100) ? '3px solid #3E3A39' : '0';
  }
  $('groups').addEventListener('change', function (e) {
    if (!e.target.classList.contains('chk')) return;
    checked[e.target.getAttribute('data-id')] = e.target.checked;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(checked)); } catch (err) {}
    updateCount();
  });
  updateCount();
})();
</script>
</body>
</html>
